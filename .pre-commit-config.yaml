repos:
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
      - id: statix
        name: statix
        entry: statix check .
        language: system
        types: [nix]
        pass_filenames: false
      - id: deadnix
        name: deadnix
        entry: deadnix --fail
        language: system
        types: [nix]
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: luacheck
        name: Luacheck
        entry: luacheck
        language: system
        types: [lua]
        exclude: ^lua/dkjson\.lua$
      - id: luac-check
        name: Lua syntax check
        entry: luac -p
        language: system
        types: [lua]
        exclude: ^lua/dkjson\.lua$
      - id: lua-tests
        name: Lua bridge tests
        entry: busted tests/lua
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: mypy --config-file pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
