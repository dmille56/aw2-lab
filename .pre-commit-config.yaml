repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: luacheck
        name: Luacheck
        entry: luacheck
        language: system
        types: [lua]
      - id: luac-check
        name: Lua syntax check
        entry: luac -p
        language: system
        types: [lua]
      - id: mypy
        name: mypy
        entry: mypy --config-file pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
