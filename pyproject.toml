[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aw2-lab"
version = "0.1.0"
description = "Server-authoritative Advance Wars 2 emulator platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp>=1.0,<2",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
aw2-lab = "aw2_lab.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "python-lsp-server>=1.12,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aw2_lab"]
force-include = { "lua/bridge.lua" = "aw2_lab/lua/bridge.lua" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
files = ["src/aw2_lab"]
strict = true
ignore_missing_imports = true
